<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Wiki</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <nav id="sidebar">
    <div class="sidebar-header">
      <h1 id="wiki-title">World of Mircuria</h1>
    </div>
    <input type="text" id="search" placeholder="Search pages...">
    <div id="nav-tree"></div>
  </nav>

  <main id="content">
    <article id="page-content">
      <h1>Welcome</h1>
      <p>Select a page from the sidebar, or start adding content to the <code>pages/</code> directory.</p>
    </article>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/wiki.js"></script>
</body>
</html>
